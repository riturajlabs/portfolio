name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The test toolchain enforces a Node 22 floor: the pinned jsdom needs
      # ^22.22.2 on the 22.x line, vitest needs ^22.12, undici needs >=22.19,
      # and eslint needs ^22.13. 22.22.2 is the smallest version satisfying all
      # of them, and `package.json` pins engines to that same ^22 range so CI
      # and local dev cannot drift onto an untested major.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm deps
        run: npm ci

      - name: Install backend + ai_service deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install -r ai_service/requirements.txt

      - name: Install postgres client (for e2e DB provisioning)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create test databases
        run: |
          for db in portfolio_test portfolio_e2e portfolio_dev; do
            psql -h 127.0.0.1 -U postgres -d postgres -tAc \
              "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 \
              || psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE $db"
          done

      # Production behaviour guard: the content stylesheets and data modules are
      # read-only paddles for the PR; any change fails the build. (MIGRATION.md §7)
      - name: Tripwire — src/data and src/styles must be unchanged
        run: |
          base="$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD main 2>/dev/null || echo HEAD)"
          if ! git diff --quiet "$base" HEAD -- src/data src/styles; then
            echo "::error::src/data or src/styles changed relative to $(git rev-parse --short "$base")"
            git diff --stat "$base" HEAD -- src/data src/styles
            exit 1
          fi

      - name: Lint (frontend)
        run: npm run lint

      - name: Unit tests (frontend, jsdom)
        run: npm test

      # The seed snapshot is generated here, never committed: `.cache/` is
      # gitignored, so a clean checkout has no snapshot. It MUST exist before any
      # test that reads it: the backend `test_seed.py` (`load_snapshot`) as well
      # as the AI-service `canonical_payload` fixture both read
      # `.cache/content-snapshot.json`. `scripts/extract-content.mjs` is
      # byte-deterministic and validates the whole payload before writing; a
      # non-zero exit fails this step (and the job) before any database work.
      - name: Extract deterministic seed snapshot
        run: npm run seed:extract

      - name: API tests (backend, pytest)
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/portfolio_test
        run: npm run test:api

      - name: AI service lint + tests
        run: |
          npm run lint:ai_service
          npm run test:ai_service

      - name: Provision the content backend and build the site
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/portfolio_dev
          ENVIRONMENT: development
          SECRET_KEY: ci-none-prod
          RESEND_API_KEY: re_ci_dummy
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci-inbox@example.com
          # CI-only: pin the e2e build to the same-origin dev target so the
          # bundle matches e2e/intercept.mjs's localhost:8000 sandbox (the
          # production build must never set this — see .env.example).
          VITE_BACKEND_URL: http://localhost:8000
        run: |
          set -e
          (cd backend && python -m alembic upgrade head)
          # No path argument: `db.seed` defaults to the repo-root snapshot
          # (REPO_ROOT/.cache/content-snapshot.json), written by the
          # "Extract deterministic seed snapshot" step above.
          (cd backend && python -m db.seed)
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 \
            >/tmp/ci-backend.log 2>&1 & echo $! > /tmp/ci-backend.pid)
          trap 'kill "$(cat /tmp/ci-backend.pid)" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/ready >/dev/null || { echo "backend never became ready"; cat /tmp/ci-backend.log; exit 1; }
          curl -fsS http://127.0.0.1:8001/api/content >/dev/null
          npm run build

      - name: Migration validation (dist structure + metadata contracts)
        run: npm run test:migration-validation

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End to end tests (public + admin + chat + contact)
        env:
          E2E_DATABASE_USER: postgres
          VITE_BACKEND_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-backend.log
          path: /tmp/ci-backend.log
          retention-days: 7