# Alembic configuration.
#
# `sqlalchemy.url` is intentionally empty. The URL is supplied at runtime by
# `alembic/env.py` from the DATABASE_URL environment variable, so credentials
# never live in a committed file and a migration can never target a different
# database than the application.
#
#   alembic upgrade head
#   alembic current
#   alembic check
#   alembic downgrade base

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Use a timestamped, sortable filename for new revisions. The Phase 2 revision
# is named 0001_initial by hand.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S