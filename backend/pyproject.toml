[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend and PostgreSQL foundation for the portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Powers `EmailStr` in the contact schema (`API.md` §2.3), the same
    # validation `ai_service` used. pydantic does not vendor it.
    "email-validator>=2.0",
    "python-dotenv>=1.0",
    # Outbound HTTPS client for `/api/contact` (Resend) and `/api/github`
    # (Phase 8). Existed only as a dev dependency for test wiring; the two
    # public endpoints make it a runtime dependency.
    "httpx>=0.27",
    "slowapi>=0.1.9",
    # Argon2id password hashing. `SECURITY.md` §3.1 names Argon2id and rules out
    # bcrypt, scrypt and PBKDF2, so this is the only hashing dependency and the
    # admin session design does not change.
    "argon2-cffi>=23.1",
    # S3-compatible object storage for admin-uploaded project images (Neon
    # Object Storage). boto3 is the client; python-multipart is what FastAPI
    # needs to parse the `multipart/form-data` upload body.
    "boto3>=1.34",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "db*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated; reformatting them would only create noise in
# review and in future autogenerate diffs.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A missing/unreachable database must fail loudly, not skip.
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]