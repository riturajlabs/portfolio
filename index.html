<!doctype html>
<html lang="en">

<head>

  <!-- ========================================================= -->
  <!-- Basic -->
  <!-- ========================================================= -->

  <meta charset="UTF-8">


  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">


  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge">



  <!-- ========================================================= -->
  <!-- SEO FALLBACK -->
  <!-- React Helmet will override this -->
  <!-- ========================================================= -->


  <title>
    Ritu Raj Portfolio
  </title>


  <meta
    name="description"
    content="Ritu Raj Portfolio - Full Stack Developer and AI & Machine Learning Student."
  >


  <meta
    name="author"
    content="Ritu Raj"
  >


  <meta
    name="robots"
    content="index, follow"
  >



  <!-- ========================================================= -->
  <!-- Theme -->
  <!-- ========================================================= -->


  <meta
    name="theme-color"
    content="#2563EB">


  <meta
    name="color-scheme"
    content="dark light">



  <!-- ========================================================= -->
  <!-- PWA -->
  <!-- ========================================================= -->
  <!--
    No web manifest or service worker is registered. The previous
    site.webmanifest didn't make the site "installable" (browsers
    require a registered service worker before prompting the user
    to add to home screen) and cost us a 404 risk on misconfigured
    hosts. Mobile theme color is still set via the <meta name="theme-color">
    tag above.
  -->



  <!-- ========================================================= -->
  <!-- Icons -->
  <!-- ========================================================= -->


  <link
    rel="icon"
    type="image/png"
    href="/favicon.png">


  <link
    rel="apple-touch-icon"
    href="/favicon.png">


</head>



<body>


  <div id="root"></div>


  <script
    type="module"
    src="/src/main.jsx">
  </script>

  
  <h1 style="
  position:absolute;
  left:-9999px;
  top:-9999px;
  ">
  Ritu Raj | Full Stack Developer | AI & Machine Learning Student
  </h1>

  <div id="root"></div>


</body>


</html>
