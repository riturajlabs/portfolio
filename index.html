<!doctype html>
<html lang="en">

<head>

  <!-- ========================================================= -->
  <!-- Basic -->
  <!-- ========================================================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge">

  <!-- Theme -->

  <meta
    name="theme-color"
    content="#2563EB">

  <meta
    name="color-scheme"
    content="dark light">

  <!-- PWA -->

  <link
    rel="manifest"
    href="/site.webmanifest">

  <!-- Icons -->

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png">

  <link
    rel="apple-touch-icon"
    href="/favicon.png">

  <!-- ========================================================= -->
  <!-- JSON-LD : Person -->
  <!-- ========================================================= -->

  <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Person",
  "name":"Ritu Raj",
  "alternateName":"RituRajLabs",
  "url":"https://riturajlabs.vercel.app/",
  "image":"https://riturajlabs.vercel.app/images/ritu.png",
  "jobTitle":"Full Stack Developer",
  "description":"Full Stack Developer and AI & Machine Learning Student.",
  "sameAs":[
    "https://github.com/riturajlabs",
    "https://linkedin.com/in/riturajlabs"
  ],
  "knowsAbout":[
    "React",
    "JavaScript",
    "Node.js",
    "Express.js",
    "MongoDB",
    "Java",
    "Python",
    "Machine Learning",
    "Artificial Intelligence",
    "Data Structures and Algorithms"
  ]
}
</script>

  <!-- ========================================================= -->
  <!-- JSON-LD : Website -->
  <!-- ========================================================= -->

  <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"Ritu Raj Portfolio",
  "url":"https://riturajlabs.vercel.app/"
}
</script>

  <!-- ========================================================= -->
  <!-- JSON-LD : Organization -->
  <!-- ========================================================= -->

  <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Organization",
  "name":"RituRajLabs",
  "url":"https://riturajlabs.vercel.app/",
  "logo":"https://riturajlabs.vercel.app/favicon.png"
},
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Ritu Raj Portfolio",
  "url": "https://riturajlabs.vercel.app/",
  "description": "Official portfolio of Ritu Raj (riturajlabs), Full Stack Developer and AI & Machine Learning student."
}
</script>

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"></script>

</body>

</html>
